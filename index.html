      <h1>Boussole — réduire ses impôts et connaître ses droits sociaux</h1>
      <p>Boussole est une application gratuite d'éducation et d'orientation à l'optimisation
      financière en France. Elle t'aide à comprendre les dispositifs fiscaux et sociaux qui
      correspondent à ta situation, sans jamais te conseiller de produit ni de montant.</p>
      <h2>Ce que tu trouves dans Boussole</h2>
      <ul>
        <li><strong>Leviers fiscaux chiffrés</strong> — les principaux moyens de réduire ton imposition, expliqués clairement.</li>
        <li><strong>Niches fiscales</strong> — un panorama classé selon ton profil, sources officielles à l'appui.</li>
        <li><strong>Droits sociaux</strong> — estimation CAF, RSA, APL via le moteur public OpenFisca.</li>
        <li><strong>Événements de vie</strong> — naissance, déménagement, perte d'emploi, retraite et leurs conséquences.</li>
        <li><strong>Cases de déclaration</strong> — où reporter chaque dispositif sur ta déclaration 2042.</li>
        <li><strong>Chiffrage réel</strong> — l'économie d'impôt d'un versement PER, à partir de ton avis lu sur l'appareil.</li>
      </ul>
      <h2>Ta vie privée d'abord</h2>
      <p>Aucun compte, aucun envoi de données : tout est calculé sur ton appareil. Le moteur
      OpenFisca n'est appelé que si tu le demandes explicitement.</p>
      <p>Cette application nécessite JavaScript. Active-le pour démarrer ton bilan.</p>
