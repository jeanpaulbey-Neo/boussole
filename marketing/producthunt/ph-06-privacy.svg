<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap');
      .serif{font-family:'Fraunces',Georgia,serif}
      .sans{font-family:'Manrope','DejaVu Sans',sans-serif}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5C4A"/>
      <stop offset="1" stop-color="#0A3F32"/>
    </linearGradient>
  </defs>
  <rect width="1270" height="760" fill="url(#bg)"/>

  <g transform="translate(90,72)">
    <text x="0" y="34" font-size="40">🧭</text>
    <text x="54" y="36" class="serif" font-size="34" font-weight="700" fill="#F7F3E9">OptiBoussole</text>
  </g>

  <text x="635" y="298" text-anchor="middle" class="serif" font-size="92" font-weight="700" fill="#F7F3E9">100 % sur votre appareil.</text>
  <text x="635" y="368" text-anchor="middle" class="sans" font-size="30" font-weight="500" fill="#CFE0D8">Aucune donnée envoyée. Aucun compte. Aucune publicité.</text>

  <!-- badges -->
  <g class="sans" font-weight="700">
    <g transform="translate(170,452)">
      <rect width="300" height="150" rx="28" fill="#0C4A3B" stroke="#1C6B57" stroke-width="2"/>
      <text x="150" y="78" text-anchor="middle" font-size="48">🔒</text>
      <text x="150" y="120" text-anchor="middle" font-size="24" fill="#EAF4EE">Données on-device</text>
    </g>
    <g transform="translate(485,452)">
      <rect width="300" height="150" rx="28" fill="#0C4A3B" stroke="#1C6B57" stroke-width="2"/>
      <text x="150" y="78" text-anchor="middle" font-size="48">⚙️</text>
      <text x="150" y="114" text-anchor="middle" font-size="24" fill="#EAF4EE">Moteur public</text>
      <text x="150" y="142" text-anchor="middle" font-size="22" fill="#AFCBBF">OpenFisca</text>
    </g>
    <g transform="translate(800,452)">
      <rect width="300" height="150" rx="28" fill="#0C4A3B" stroke="#1C6B57" stroke-width="2"/>
      <text x="150" y="78" text-anchor="middle" font-size="48">🆓</text>
      <text x="150" y="120" text-anchor="middle" font-size="24" fill="#EAF4EE">Gratuit, sans compte</text>
    </g>
  </g>

  <text x="635" y="690" text-anchor="middle" class="sans" font-size="24" font-weight="600" fill="#E7B24C">Éducation &amp; orientation — sans conseil ni vente.</text>
</svg>
