<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réseau de neurones — primalité</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto;
           padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #8884; border-radius: 12px; padding: 1rem 1.25rem;
            margin: 1rem 0; }
    input { font-size: 1.2rem; padding: .5rem .75rem; width: 12rem;
            border-radius: 8px; border: 1px solid #8888; }
    button { font-size: 1rem; padding: .55rem 1rem; border-radius: 8px;
             border: 0; background: #4f46e5; color: #fff; cursor: pointer; }
    .verdict { font-size: 1.5rem; font-weight: 700; margin: .5rem 0; }
    .ok { color: #16a34a; } .ko { color: #dc2626; } .warn { color: #d97706; }
    .bar { height: 12px; background: #8883; border-radius: 6px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #4f46e5; }
    .meta { color: #888; font-size: .85rem; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    td, th { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #8883; }
  </style>
</head>
<body>
  <h1>Un nombre est-il premier&nbsp;? — réseau de neurones</h1>
  <p class="meta">
    Le perceptron multicouche donne une <strong>probabilité</strong>. On la compare à
    la vérité-terrain (division d'essai) pour montrer où le réseau se trompe.
    Modèle entraîné en JavaScript pur, sans bibliothèque.
  </p>

  <div class="card">
    <label for="n">Entier à tester</label><br />
    <input id="n" type="number" min="0" value="7919" />
    <button id="go">Évaluer</button>
    <div id="result"></div>
  </div>

  <div class="card">
    <strong>Quelques exemples</strong>
    <table id="examples"><tbody></tbody></table>
  </div>

  <p class="meta" id="modelMeta"></p>

  <script type="module">
    import { MLP } from './nn-browser.mjs';
    import { encode } from './features-browser.mjs';

    // Vérité-terrain (division d'essai) — pour comparer dans le navigateur.
    function isPrime(n) {
      if (!Number.isInteger(n) || n < 2) return false;
      if (n < 4) return true;
      if (n % 2 === 0 || n % 3 === 0) return false;
      for (let i = 5; i * i <= n; i += 6)
        if (n % i === 0 || n % (i + 2) === 0) return false;
      return true;
    }

    const raw = await fetch('./model.json').then(r => r.json());
    const net = MLP.fromJSON(raw);
    const threshold = raw.threshold ?? 0.5;
    document.getElementById('modelMeta').textContent =
      `Modèle entraîné jusqu'à ${raw.trainedUpTo} • seuil ${threshold} • créé le ${raw.createdAt}`;

    function evalN(n) {
      const p = net.predict(encode(n));
      const pred = p >= threshold;
      const real = isPrime(n);
      return { p, pred, real, ok: pred === real };
    }

    function render(n) {
      const el = document.getElementById('result');
      if (!Number.isInteger(n) || n < 0) { el.innerHTML = '<p class="warn">Entre un entier ≥ 0.</p>'; return; }
      const { p, pred, real, ok } = evalN(n);
      el.innerHTML = `
        <div class="verdict ${pred ? 'ok' : 'ko'}">
          Réseau : ${n} est ${pred ? 'PREMIER' : 'COMPOSÉ'}
        </div>
        <div class="bar"><span style="width:${(p * 100).toFixed(1)}%"></span></div>
        <p class="meta">probabilité ${(p * 100).toFixed(1)} %</p>
        <p>Vérité-terrain : <strong>${real ? 'premier' : 'composé'}</strong> —
          ${ok ? '<span class="ok">le réseau a raison ✓</span>'
               : '<span class="ko">le réseau se trompe ✗</span>'}</p>`;
    }

    document.getElementById('go').addEventListener('click', () =>
      render(Number(document.getElementById('n').value)));
    document.getElementById('n').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') render(Number(e.target.value));
    });

    const examples = [7, 12, 29, 91, 97, 561, 7919, 7920, 104729, 104730];
    const tb = document.querySelector('#examples tbody');
    tb.innerHTML = '<tr><th>n</th><th>proba</th><th>réseau</th><th>réel</th><th></th></tr>'
      + examples.map((n) => {
        const { p, pred, real, ok } = evalN(n);
        return `<tr><td>${n}</td><td>${(p * 100).toFixed(0)}%</td>`
          + `<td>${pred ? 'premier' : 'composé'}</td>`
          + `<td>${real ? 'premier' : 'composé'}</td>`
          + `<td>${ok ? '✓' : '✗'}</td></tr>`;
      }).join('');

    render(7919);
  </script>
</body>
</html>
